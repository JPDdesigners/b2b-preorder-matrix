<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B2B list · local integration fixture</title><style>body{margin:0;background:#fafafa;font:14px system-ui}nav{padding:14px 28px;border-bottom:1px solid #e4e4e7;background:white;font-size:12px;color:#71717a}/* Simulate common unlayered theme interference. */button{margin-bottom:1em;text-transform:uppercase;letter-spacing:.1em;border-radius:0}h1,h2,h3{font-size:28px;margin-bottom:20px}input,select,textarea{box-shadow:inset 0 1px 2px #ddd}a{color:#333}</style></head><body><nav>Τοπική προεπισκόπηση · δοκιμαστικά δεδομένα · καμία σύνδεση με κατάστημα</nav><div class="b2b-order-list-container" data-b2b-config='{"ajaxUrl":"/fixture/admin-ajax.php","loginUrl":"?","restBase":"/wp-json/b2b/v1"}'></div>

 });

window.fetch = async (url, options={}) => {
 const target=new URL(url,location.origin);if(!target.pathname.startsWith('/fixture/'))return originalFetch(url,options);
 const fields=options.method==='POST'?new URLSearchParams(options.body):target.searchParams;const action=fields.get('action');
 requestCounts[action] = (requestCounts[action] || 0) + 1; document.querySelector('nav').dataset.requests = JSON.stringify(requestCounts);
 if(action==='b2b_search_products')document.querySelector('nav').dataset.completedSearch='';

 if(flags.has('slow')&&['b2b_start_order','b2b_add_order_batch','b2b_finalize_order'].includes(action))await new Promise(r=>setTimeout(r,2500));

 if(flags.has('retryfinal')&&action==='b2b_finalize_order'&&!failedOnce){failedOnce=true;return new Response(JSON.stringify({success:false,data:{message:'Η ολοκλήρωση διακόπηκε. Δοκιμάστε Συνέχιση.'}}),{status:503});}

 if(flags.has('guest'))return new Response(JSON.stringify({success:false,data:{message:'Συνδεθείτε για να δείτε τη λίστα σας.'}}),{status:401});
 if(action==='b2b_get_preorder_list_data') data={...payload(),removedItems,removedNoticeToken:removedItems.length?'fixture-cancellation-1':''};

 else if(action==='b2b_matrix_session') data={user_id:7,nonce:'fixture'};

   const matched=matched_sku.toLocaleLowerCase('el'),sku_match=matched===query?'exact':matched.startsWith(query)&&matched?'prefix':matched?'contains':product.name.toLocaleLowerCase('el').includes(query)?'title':'';

  }).filter(product=>product.sku_match).sort((a,b)=>ranks[a.sku_match]-ranks[b.sku_match]||(a.matched_sku||a.name).localeCompare(b.matched_sku||b.name)).slice(0,8);

  const total_qty=Object.values(saved).reduce((a,b)=>a+b,0), total_val=cells.reduce((n,cell)=>n+Math.round(cell.price*100)*(saved[cell.id]||0),0)/100;
